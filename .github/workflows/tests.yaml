name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.mdx"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.mdx"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    name: Test and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter Markdown-only releases
        id: release_changes
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const currentRelease = context.payload.release;
            const currentTag = currentRelease.tag_name;
            try {
              const releases = await github.paginate(
                github.rest.repos.listReleases,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                },
              );
              const currentPublishedAt = Date.parse(currentRelease.published_at);
              const previousRelease = releases
                .filter(
                  (release) =>
                    release.tag_name !== currentTag &&
                    !release.draft &&
                    release.published_at &&
                    Date.parse(release.published_at) < currentPublishedAt,
                )
                .sort(
                  (a, b) =>
                    Date.parse(b.published_at) - Date.parse(a.published_at),
                )[0];

              if (!previousRelease) {
                core.info("No previous published release; tests will run.");
                core.setOutput("run-tests", "true");
                return;
              }

              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: previousRelease.tag_name,
                head: currentTag,
              });
              const files = comparison.data.files;
              const markdownOnly =
                files &&
                files.length < 300 &&
                files.every((file) => /\.(md|markdown|mdx)$/i.test(file.filename));
              core.setOutput("run-tests", markdownOnly ? "false" : "true");
            } catch (error) {
              core.warning(
                `Could not determine release changes; tests will run: ${error.message}`,
              );
              core.setOutput("run-tests", "true");
            }

      - name: Set up Python
        if: steps.release_changes.outputs.run-tests != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        if: steps.release_changes.outputs.run-tests != 'false'
        run: python -m pip install -r requirements_test.txt

      - name: Run tests
        if: steps.release_changes.outputs.run-tests != 'false'
        run: pytest

      - name: Run strict type checking
        if: steps.release_changes.outputs.run-tests != 'false'
        run: mypy --strict custom_components/omlet_coop
